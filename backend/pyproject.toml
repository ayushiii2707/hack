[project]
name = "checkout-copilot-backend"
version = "1.0.0"
description = "Conversational checkout agent with strict backend-enforced boundaries."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
